# Alginte playground -- start here: the whole product with its own broker, isolated
# on your machine, one command:
#
#     docker compose up -d        ->  http://localhost:8888
#     docker compose down         ->  everything gone, nothing left behind
#
# What you get: Alginte + a single-node Kafka (KRaft) + Schema Registry, with
# sample topics, records, and a consumer group showing real lag -- so every
# screen has something to look at. The `orders` topic holds real Avro records
# framed against the registered `orders-value` subject, and the blog post's
# topology (orders -> order total -> big orders -> orders-enriched) is deployed
# through Alginte's own API on startup -- the post's clips can be taken apart
# here, node by node. The `text-lines` topic is seeded as input for building
# your first Streams topology by hand (the word-count walkthrough in the docs:
# https://docs.alginte.com/streams/building).
#
# This is the product's isolated mode, whether or not you have a cluster: the
# stack is yours alone and leaves nothing behind, so a stream can be designed,
# deployed and run wrong here at no cost, then carried to your cluster as a
# file (Download on the builder, Upload on the other side) once it runs right.
#
# Design choices, deliberate:
#   - No auth: the UI is published on 127.0.0.1 only -- your machine, your rules.
#   - No volumes: `down` resets the playground completely; `up` reseeds fresh.
#   - `alginte/alginte:latest`: the playground always shows the current release.
#     Pin one without editing: ALGINTE_IMAGE=alginte/alginte:0.12.0 docker compose up -d
#   - Every image is a variable with its default in this file, the way the port
#     is (ALGINTE_PORT); nothing needs a .env:
#       ALGINTE_IMAGE      alginte/alginte:latest   the console
#       CONFLUENT_VERSION  8.2.0                    cp-kafka and cp-schema-registry, broker and seeds
#       CURL_VERSION       8.10.1                   the stream seed's curl image
#   - No Kafka Connect / ksqlDB: their URL props stay empty, so the UI hides
#     those areas honestly instead of showing broken ones.
#   - Sandbox mode on (ALGINTE_SANDBOX_ENABLED): the MCP endpoint at /mcp also
#     offers the tools that deploy and reset stream designs here, because here
#     nothing shared can be harmed.
#   - Bring your own: two optional folders beside this file, `schemas/` and
#     `records/`, registered and produced at every `up`, so your schemas and a
#     sample of your records survive the reset. Empty folders do nothing.
#       schemas/<subject>.avsc | .json | .proto     -> registered under <subject>
#       records/<topic>.avro.jsonl | .json-schema.jsonl | .protobuf.jsonl
#                                                  -> framed against <topic>-value
#       records/<topic>.json.jsonl                  -> plain JSON, no registry
#     One record per line, `key|{...}` for a keyed record, `{...}` for a null key.
#
# This file is standalone -- save it anywhere and `docker compose up -d`; the
# two folders appear beside it, empty, on the first `up`.

services:

  broker:
    image: confluentinc/cp-kafka:${CONFLUENT_VERSION:-8.2.0}
    hostname: broker
    restart: unless-stopped
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://broker:29092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@broker:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://broker:29092,CONTROLLER://broker:29093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      KAFKA_CLUSTER_ID: 1
      CLUSTER_ID: cGxheWdyb3VuZGNsdXN0ZXIx
    healthcheck:
      test: [ 'CMD-SHELL', 'kafka-topics --bootstrap-server broker:29092 --list' ]
      interval: 5s
      timeout: 10s
      retries: 20

  schema-registry:
    image: confluentinc/cp-schema-registry:${CONFLUENT_VERSION:-8.2.0}
    hostname: schema-registry
    restart: unless-stopped
    depends_on:
      broker:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'broker:29092'
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081

  alginte:
    image: ${ALGINTE_IMAGE:-alginte/alginte:latest}
    restart: on-failure
    depends_on:
      # The app fails fast (by design) when the broker is unreachable, so wait
      # for the broker to be healthy and let the seeds finish first -- the UI's
      # first paint then already shows the sample data.
      broker:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
      avro-seed:
        condition: service_completed_successfully
      bring-your-own:
        condition: service_completed_successfully
    ports:
      # Port taken (Jupyter also loves 8888)? Override without editing:
      #   ALGINTE_PORT=8890 docker compose up -d
      - '127.0.0.1:${ALGINTE_PORT:-8888}:8888'
    environment:
      SPRING_KAFKA_BOOTSTRAPSERVERS: broker:29092
      ALGINTE_SCHEMAREGISTRY_URL: http://schema-registry:8081/
      # Sandbox mode: this stack is nobody's shared cluster, so the MCP surface
      # also carries the tools that validate, deploy, stop and delete stream
      # designs and evaluate expressions -- an agent's workbench, blast radius
      # `docker compose down`. Never set this on an instance against a real cluster.
      ALGINTE_SANDBOX_ENABLED: "true"

  seed:
    # One-shot: sample topics and keyed JSON records for the non-orders
    # screens. The `orders` topic itself is seeded by avro-seed below --
    # real Avro records against the registered subject, matching the blog
    # post's clips.
    image: confluentinc/cp-kafka:${CONFLUENT_VERSION:-8.2.0}
    depends_on:
      broker:
        condition: service_healthy
    volumes:
      - ./records:/byo/records:ro
    entrypoint: [ '/bin/sh', '-c' ]
    command: |
      "
      echo 'Creating playground topics'
      # `orders` is a single partition ON PURPOSE: the newest record is then
      # deterministic, and the topology preview's real-record sample is the
      # same ord-1010 the blog post narrates.
      kafka-topics --bootstrap-server broker:29092 --create --if-not-exists --topic orders --replication-factor 1 --partitions 1
      for t in orders-enriched payments customers text-lines word-counts demo-input demo-output; do
        kafka-topics --bootstrap-server broker:29092 --create --if-not-exists --topic $$t --replication-factor 1 --partitions 3
      done

      echo 'Seeding sample records'
      kafka-console-producer --bootstrap-server broker:29092 --topic payments --property parse.key=true --property key.separator='|' <<'EOF'
      o-1001|{\"orderId\":\"o-1001\",\"method\":\"card\",\"amountEur\":249.90,\"status\":\"CAPTURED\"}
      o-1002|{\"orderId\":\"o-1002\",\"method\":\"paypal\",\"amountEur\":178.00,\"status\":\"CAPTURED\"}
      o-1004|{\"orderId\":\"o-1004\",\"method\":\"card\",\"amountEur\":59.99,\"status\":\"PENDING\"}
      EOF
      kafka-console-producer --bootstrap-server broker:29092 --topic customers --property parse.key=true --property key.separator='|' <<'EOF'
      c-01|{\"customerId\":\"c-01\",\"name\":\"Ana K.\",\"country\":\"HR\",\"tier\":\"gold\"}
      c-02|{\"customerId\":\"c-02\",\"name\":\"Marco B.\",\"country\":\"IT\",\"tier\":\"silver\"}
      c-03|{\"customerId\":\"c-03\",\"name\":\"Lena W.\",\"country\":\"DE\",\"tier\":\"gold\"}
      EOF

      # Input for the word-count topology you can build in the Streams builder.
      kafka-console-producer --bootstrap-server broker:29092 --topic text-lines --property parse.key=true --property key.separator='|' <<'EOF'
      l-1|the quick brown fox jumps over the lazy dog
      l-2|the dog barks and the fox runs
      l-3|streams count words the easy way
      EOF

      echo 'Playground topics seeded.'

      # Bring your own, the plain half: a topic per records/<topic>.*.jsonl
      # (three partitions, so the registry-framed files produced later by
      # bring-your-own land on a real topic rather than an auto-created one),
      # and the *.json.jsonl files produced as plain JSON here, since the
      # plain console producer lives on this image and the registry ones on
      # the other.
      for f in /byo/records/*.jsonl; do
        [ -e \"$$f\" ] || continue
        name=$$(basename \"$$f\")
        t=$${name%%.*}
        kafka-topics --bootstrap-server broker:29092 --create --if-not-exists --topic \"$$t\" --replication-factor 1 --partitions 3
      done
      for f in /byo/records/*.json.jsonl; do
        [ -e \"$$f\" ] || continue
        name=$$(basename \"$$f\")
        t=$${name%%.*}
        if grep -q '^[^{]*|' \"$$f\"; then
          kafka-console-producer --bootstrap-server broker:29092 --topic \"$$t\" --property parse.key=true --property key.separator='|' < \"$$f\"
        else
          kafka-console-producer --bootstrap-server broker:29092 --topic \"$$t\" < \"$$f\"
        fi
        echo \"records/$$name -> $$t (plain JSON)\"
      done
      "

  avro-seed:
    # One-shot, on the Schema Registry image because kafka-avro-console-producer
    # lives there. Registers `orders-value` and seeds the SAME ten Avro orders
    # the blog post's clips show -- null keys (the topology reads the key as
    # Void), registry-framed against the registered schema id so the bytes
    # match an app-produced record. The lagging `orders-auditor` group commits
    # after seven, then the last three arrive -- committed < log-end
    # deterministically, so the Offsets screen (and Alter Offset, enabled only
    # for Empty groups) has something real to show. ord-1010 lands LAST: it is
    # the newest record, the one the preview samples (Kettle, 3 x 17.0 = 51).
    image: confluentinc/cp-schema-registry:${CONFLUENT_VERSION:-8.2.0}
    depends_on:
      broker:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    entrypoint: [ '/bin/sh', '-c' ]
    command: |
      "
      echo 'Waiting for Schema Registry'
      until curl -sf http://schema-registry:8081/subjects >/dev/null; do sleep 3; done

      echo 'Registering orders-value (Avro)'
      cat > /tmp/orders-schema.json <<'EOF'
      {\"schemaType\":\"AVRO\",\"schema\":\"{\\\"type\\\":\\\"record\\\",\\\"name\\\":\\\"Order\\\",\\\"namespace\\\":\\\"com.alginte.demo\\\",\\\"fields\\\":[{\\\"name\\\":\\\"orderId\\\",\\\"type\\\":\\\"string\\\"},{\\\"name\\\":\\\"customerId\\\",\\\"type\\\":\\\"string\\\"},{\\\"name\\\":\\\"item\\\",\\\"type\\\":\\\"string\\\"},{\\\"name\\\":\\\"quantity\\\",\\\"type\\\":\\\"int\\\"},{\\\"name\\\":\\\"priceEur\\\",\\\"type\\\":\\\"double\\\"}]}\"}
      EOF
      curl -sf -X POST http://schema-registry:8081/subjects/orders-value/versions -H 'Content-Type: application/vnd.schemaregistry.v1+json' --data-binary @/tmp/orders-schema.json && echo ' <- orders-value registered'
      SCHEMA_ID=$$(curl -sf http://schema-registry:8081/subjects/orders-value/versions/latest | sed -E 's/.*\"id\":([0-9]+).*/\\1/')
      echo \"orders-value schema id: $$SCHEMA_ID\"

      echo 'Seeding Avro orders (first seven)'
      kafka-avro-console-producer --bootstrap-server broker:29092 --topic orders --property schema.registry.url=http://schema-registry:8081 --property value.schema.id=$$SCHEMA_ID <<'EOF'
      {\"orderId\":\"ord-1001\",\"customerId\":\"c-1001\",\"item\":\"Grinder\",\"quantity\":1,\"priceEur\":89.0}
      {\"orderId\":\"ord-1002\",\"customerId\":\"c-2417\",\"item\":\"Filter Pack\",\"quantity\":5,\"priceEur\":4.5}
      {\"orderId\":\"ord-1003\",\"customerId\":\"c-6650\",\"item\":\"Espresso Machine\",\"quantity\":1,\"priceEur\":249.9}
      {\"orderId\":\"ord-1004\",\"customerId\":\"c-3305\",\"item\":\"Kettle\",\"quantity\":2,\"priceEur\":59.99}
      {\"orderId\":\"ord-1005\",\"customerId\":\"c-2417\",\"item\":\"Scale\",\"quantity\":1,\"priceEur\":34.0}
      {\"orderId\":\"ord-1006\",\"customerId\":\"c-8802\",\"item\":\"Tamper\",\"quantity\":3,\"priceEur\":12.5}
      {\"orderId\":\"ord-1007\",\"customerId\":\"c-1001\",\"item\":\"Milk Jug\",\"quantity\":2,\"priceEur\":18.0}
      EOF

      echo 'Creating the lagging consumer group'
      # The AVRO console consumer, not the plain one -- this image ships only
      # the avro variants, and the plain tool silently not existing is exactly
      # the failure the || true would swallow (caught on the first live run).
      kafka-avro-console-consumer --bootstrap-server broker:29092 --topic orders --group orders-auditor --from-beginning --max-messages 7 --timeout-ms 20000 --property schema.registry.url=http://schema-registry:8081 >/dev/null || true

      echo 'Producing the post-commit batch (creates the lag; ord-1010 is newest)'
      kafka-avro-console-producer --bootstrap-server broker:29092 --topic orders --property schema.registry.url=http://schema-registry:8081 --property value.schema.id=$$SCHEMA_ID <<'EOF'
      {\"orderId\":\"ord-1008\",\"customerId\":\"c-5521\",\"item\":\"Server\",\"quantity\":1,\"priceEur\":320.0}
      {\"orderId\":\"ord-1009\",\"customerId\":\"c-8802\",\"item\":\"Cleaning Kit\",\"quantity\":4,\"priceEur\":9.75}
      {\"orderId\":\"ord-1010\",\"customerId\":\"c-6650\",\"item\":\"Kettle\",\"quantity\":3,\"priceEur\":17.0}
      EOF
      echo 'Avro orders seeded.'
      "

  bring-your-own:
    # One-shot, on the Schema Registry image: registers every file in
    # schemas/ under the subject its name says, then produces every
    # registry-framed file in records/ against its topic's <topic>-value
    # subject (the plain JSON files were produced by `seed`). Both folders
    # are optional and empty by default; a run over empty folders does
    # nothing and succeeds. Keys are strings; a line `key|{...}` is keyed, a
    # line `{...}` has a null key. Schema references are not resolved:
    # register referenced subjects first by naming them so they sort first.
    image: confluentinc/cp-schema-registry:${CONFLUENT_VERSION:-8.2.0}
    depends_on:
      broker:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
      avro-seed:
        condition: service_completed_successfully
    volumes:
      - ./schemas:/byo/schemas:ro
      - ./records:/byo/records:ro
    entrypoint: [ '/bin/sh', '-c' ]
    command: |
      "
      echo 'Waiting for Schema Registry'
      until curl -sf http://schema-registry:8081/subjects >/dev/null; do sleep 3; done

      python3 - <<'EOF'
      import glob, json, os, urllib.request
      SR = 'http://schema-registry:8081'
      types = {'.avsc': 'AVRO', '.json': 'JSON', '.proto': 'PROTOBUF'}
      for path in sorted(glob.glob('/byo/schemas/*')):
          stem, ext = os.path.splitext(os.path.basename(path))
          if ext not in types:
              continue
          body = json.dumps({'schemaType': types[ext], 'schema': open(path, encoding='utf-8').read()}).encode()
          req = urllib.request.Request(SR + '/subjects/' + stem + '/versions', data=body, method='POST',
                                       headers={'Content-Type': 'application/vnd.schemaregistry.v1+json'})
          try:
              with urllib.request.urlopen(req) as r:
                  print('schemas/' + os.path.basename(path) + ' -> ' + stem + ' ' + r.read().decode())
          except urllib.error.HTTPError as e:
              print('schemas/' + os.path.basename(path) + ' REFUSED: ' + e.read().decode())
      EOF

      for f in /byo/records/*.avro.jsonl /byo/records/*.json-schema.jsonl /byo/records/*.protobuf.jsonl; do
        [ -e \"$$f\" ] || continue
        name=$$(basename \"$$f\")
        t=$${name%%.*}
        fmt=$${name#*.}; fmt=$${fmt%.jsonl}
        case \"$$fmt\" in
          avro) producer=kafka-avro-console-producer ;;
          json-schema) producer=kafka-json-schema-console-producer ;;
          protobuf) producer=kafka-protobuf-console-producer ;;
        esac
        id=$$(curl -sf http://schema-registry:8081/subjects/$$t-value/versions/latest | sed -E 's/.*\"id\":([0-9]+).*/\\1/')
        if [ -z \"$$id\" ]; then echo \"records/$$name: no subject $$t-value registered, skipped\"; continue; fi
        if grep -q '^[^{]*|' \"$$f\"; then
          $$producer --bootstrap-server broker:29092 --topic \"$$t\" --property schema.registry.url=http://schema-registry:8081 --property value.schema.id=$$id --property parse.key=true --property key.separator='|' --property key.serializer=org.apache.kafka.common.serialization.StringSerializer < \"$$f\"
        else
          $$producer --bootstrap-server broker:29092 --topic \"$$t\" --property schema.registry.url=http://schema-registry:8081 --property value.schema.id=$$id < \"$$f\"
        fi
        echo \"records/$$name -> $$t ($$fmt, schema id $$id)\"
      done
      echo 'Bring-your-own done.'
      "

  stream-seed:
    # One-shot: deploys the blog post's topology (orders -> order total ->
    # big orders -> orders-enriched) through Alginte's own API, expressions
    # and all -- so the Streams area shows the deployed canvas from the clips,
    # per-node badges included, and the sink topic fills with real output.
    # No CSRF dance here, unlike the demo rig's seed: the playground runs with
    # auth off, so a plain POST is accepted.
    image: curlimages/curl:${CURL_VERSION:-8.10.1}
    depends_on:
      alginte:
        condition: service_started
    entrypoint: [ '/bin/sh', '-c' ]
    command: |
      "
      echo 'Waiting for Alginte'
      until curl -sf http://alginte:8888/actuator/health >/dev/null; do sleep 3; done

      cat > /tmp/stream.json <<'EOF'
      {
        \"configuration\": { \"application.id\": \"orderEnrichment\" },
        \"nodes\": [
          { \"id\": \"src\", \"type\": \"SOURCE_STREAM\", \"position\": { \"x\": 340, \"y\": 0 },
            \"data\": { \"name\": \"Orders\", \"streamSourceTarget\": \"STREAM\", \"inputTopics\": [\"orders\"],
                      \"keySerde\": \"Void\", \"valueSerde\": \"Avro\", \"valueSubject\": \"orders-value\" } },
          { \"id\": \"enrich\", \"type\": \"MAP_VALUES\", \"position\": { \"x\": 340, \"y\": 160 },
            \"data\": { \"name\": \"order total\",
                      \"expression\": { \"expression\": \"{'customer': value.get('customerId'), 'product': value.get('item'), 'total': value.get('quantity') * value.get('priceEur')}\", \"language\": \"SpEL\" } } },
          { \"id\": \"bigOnly\", \"type\": \"FILTER\", \"position\": { \"x\": 340, \"y\": 320 },
            \"data\": { \"name\": \"big orders\",
                      \"expression\": { \"expression\": \"value.get('total') > 50\", \"language\": \"SpEL\" } } },
          { \"id\": \"sink\", \"type\": \"SINK_NODE\", \"position\": { \"x\": 340, \"y\": 480 },
            \"data\": { \"name\": \"Big Orders\", \"topicName\": \"orders-enriched\", \"keySerde\": \"Void\", \"valueSerde\": \"JSON\" } }
        ],
        \"edges\": [
          { \"id\": \"e1\", \"animated\": false, \"source\": \"src\", \"target\": \"enrich\", \"type\": \"deletable-edge\",
            \"markerEnd\": { \"type\": \"arrow\", \"width\": 30, \"height\": 30, \"color\": \"#b1b1b7\" }, \"data\": { \"label\": null } },
          { \"id\": \"e2\", \"animated\": false, \"source\": \"enrich\", \"target\": \"bigOnly\", \"type\": \"deletable-edge\",
            \"markerEnd\": { \"type\": \"arrow\", \"width\": 30, \"height\": 30, \"color\": \"#b1b1b7\" }, \"data\": { \"label\": null } },
          { \"id\": \"e3\", \"animated\": false, \"source\": \"bigOnly\", \"target\": \"sink\", \"type\": \"deletable-edge\",
            \"markerEnd\": { \"type\": \"arrow\", \"width\": 30, \"height\": 30, \"color\": \"#b1b1b7\" }, \"data\": { \"label\": null } }
        ]
      }
      EOF
      echo 'Deploying the blog topology'
      curl -sf -X POST http://alginte:8888/api/kafka-streams/create-stream-from-react-flow -H 'Content-Type: application/json' --data-binary @/tmp/stream.json >/dev/null && echo ' <- orderEnrichment deployed'
      "
